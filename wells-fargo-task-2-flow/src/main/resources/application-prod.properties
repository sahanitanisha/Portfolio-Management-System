# ===========================================================================
# Production profile (activate with --spring.profiles.active=prod).
# PostgreSQL datasource, Flyway-managed schema, Hibernate validate-only.
# All secrets/credentials come from the environment - never hard-coded here.
# ===========================================================================
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USERNAME:portfolio}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate validates the schema; Flyway owns it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis-backed cache for volatile market data (FX rates).
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=true

# Tracing: sample a fraction of requests in production (override via env).
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Management endpoints on an isolated port (kept off the public Service in k8s);
# Kubernetes liveness/readiness probe groups are exposed under /actuator/health.
management.server.port=${MANAGEMENT_SERVER_PORT:8080}
management.endpoint.health.probes.enabled=true

# WebSocket origins must be an explicit allow-list in production (comma-separated).
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:https://app.example.com}
# CORS allow-list for the REST API in production (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.example.com}

# H2 console disabled in production.
spring.h2.console.enabled=false

# JWT RS256 keys (Base64 DER) must be provided via environment in production:
#   APP_SECURITY_JWT_PRIVATE_KEY (PKCS#8), APP_SECURITY_JWT_PUBLIC_KEY (X.509).
# Leave the bootstrap admin unset in production (create admins via a controlled process).
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
