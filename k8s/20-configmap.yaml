apiVersion: v1
kind: ConfigMap
metadata:
  name: pms-config
  namespace: portfolio
data:
  SPRING_PROFILES_ACTIVE: "prod"
  JDBC_URL: "jdbc:postgresql://postgres:5432/portfolio"
  DB_USERNAME: "portfolio"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  BOOTSTRAP_ADMIN_USERNAME: "admin"
  # Management endpoints run on a separate, internal-only port.
  MANAGEMENT_SERVER_PORT: "9090"
  TRACING_SAMPLE_RATE: "0.1"
  OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
