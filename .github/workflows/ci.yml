name: CI

on:
  push:
    branches: [ main, master, flow ]
  pull_request:
    branches: [ main, master, flow ]

jobs:
  build:
    name: Build · Test · Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wells-fargo-task-2-flow

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test, and enforce coverage gate
        run: ./mvnw -B -ntp clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: wells-fargo-task-2-flow/target/site/jacoco

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: wells-fargo-task-2-flow/target/surefire-reports
