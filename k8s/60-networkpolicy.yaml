# Default-deny ingress for the app pods, then allow:
#   - the API port (8080) in-cluster (e.g. from the ingress controller)
#   - the isolated management port (9090) ONLY from the monitoring namespace (Prometheus)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pms-app
  namespace: portfolio
spec:
  podSelector:
    matchLabels:
      app: pms
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090
          protocol: TCP
