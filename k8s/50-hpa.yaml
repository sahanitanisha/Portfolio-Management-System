apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pms-app
  namespace: portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pms-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
# Requires metrics-server. The app is stateless (JWT, no HTTP session), so it
# scales horizontally; PostgreSQL and Redis are expected as managed services
# or their own charts referenced by pms-config.
