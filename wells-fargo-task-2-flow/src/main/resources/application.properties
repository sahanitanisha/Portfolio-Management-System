# ---------------------------------------------------------------------------
# Datasource (development) - in-memory H2 in PostgreSQL-compatibility mode so
# the SQL exercised in dev matches the intended production engine.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------------------------------------------------------------------------
# JPA / Hibernate
#   ddl-auto=update is acceptable for dev only; production schema changes must
#   be managed by versioned migrations (Flyway/Liquibase) - see roadmap.
#   open-in-view=false closes the session at the service boundary, forcing
#   explicit fetch decisions and preventing the OSIV lazy-loading anti-pattern.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Store all Instants as UTC in plain TIMESTAMP columns (deterministic across H2/PostgreSQL),
# so the Flyway baseline matches what Hibernate validates in the prod profile.
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

# H2 web console (dev convenience): http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Logging - SQL visibility during development
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------------------------------------------------------------------------
# Security - stateless JWT (RS256). Leave the keys blank in dev to auto-generate
# an ephemeral RSA key pair at startup; in production supply Base64 DER keys via
# env (PKCS#8 private, X.509 public). Access tokens are short-lived; refresh
# tokens are longer-lived and revocable (see RefreshTokenService).
# ---------------------------------------------------------------------------
app.security.jwt.private-key=${APP_SECURITY_JWT_PRIVATE_KEY:}
app.security.jwt.public-key=${APP_SECURITY_JWT_PUBLIC_KEY:}
app.security.jwt.access-expiration-seconds=900
app.security.jwt.refresh-expiration-seconds=604800
# Dev-only bootstrap administrator - change/remove these before production.
app.security.bootstrap-admin.username=admin
app.security.bootstrap-admin.password=admin12345
# Login throttling (brute-force protection): block a username after N failures within the window.
app.security.login.max-attempts=5
app.security.login.window-seconds=900
# WebSocket origins: permissive in dev; restricted to an explicit allow-list in prod.
app.websocket.allowed-origins=*
# CORS origins for the REST API: permissive in dev; explicit allow-list in prod.
app.cors.allowed-origins=*

# Flyway is disabled by default (dev uses ddl-auto); the prod profile enables it.
spring.flyway.enabled=false

# ---------------------------------------------------------------------------
# Resilience4j - resilient FX feed ("fx" instance): retry with exponential
# backoff + circuit breaker (see RemoteFxRateClient).
# ---------------------------------------------------------------------------
resilience4j.retry.instances.fx.max-attempts=3
resilience4j.retry.instances.fx.wait-duration=200ms
resilience4j.retry.instances.fx.enable-exponential-backoff=true
resilience4j.retry.instances.fx.exponential-backoff-multiplier=2
resilience4j.circuitbreaker.instances.fx.sliding-window-size=20
resilience4j.circuitbreaker.instances.fx.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fx.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fx.permitted-number-of-calls-in-half-open-state=3

# ---------------------------------------------------------------------------
# Observability - Actuator + Micrometer/Prometheus. Scrape metrics at
# /actuator/prometheus; liveness/readiness at /actuator/health.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.circuitbreakers.enabled=true
management.metrics.tags.application=portfolio-management-system
management.info.env.enabled=true
info.app.name=Portfolio Management System
info.app.description=Enterprise FinTech portfolio management platform

# ---------------------------------------------------------------------------
# Caching - dev/tests use an in-memory simple cache (no Redis needed). The prod
# profile switches to Redis. Redis health is disabled here so a missing local
# Redis does not mark /actuator/health DOWN in development.
# ---------------------------------------------------------------------------
spring.cache.type=simple
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=false

# ---------------------------------------------------------------------------
# Distributed tracing - Micrometer Tracing -> OpenTelemetry (OTLP). Trace and
# span IDs are injected into the JSON logs (see logback-spring.xml). Point the
# exporter at a collector (Jaeger / Tempo / OTel Collector) listening on 4318.
# ---------------------------------------------------------------------------
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
